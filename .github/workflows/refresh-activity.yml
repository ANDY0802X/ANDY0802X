name: Refresh colorful activity panel

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public activity signal
        run: python scripts/refresh_activity.py
      - name: Commit activity panel
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh activity panel"
          file_pattern: assets/activity-panel.svg
