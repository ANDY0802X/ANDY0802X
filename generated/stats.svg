<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 360" role="img" aria-labelledby="title desc">
<title id="title">Live GitHub statistics</title><desc id="desc">Public GitHub profile metrics, refreshed from the API.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d13"/><stop offset="1" stop-color="#0d171d"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2a3945" stroke-opacity=".18"/></pattern>
<style>.ui{font-family:Arial,sans-serif}.mono{font-family:'Courier New',monospace}.h{font-size:13px;fill:#5edbff}.body{font-size:11px;fill:#81909e}.label{font-size:9px;fill:#65727f;letter-spacing:1.5px}.value{font-size:23px;font-weight:bold;fill:#e7edf2}.line{stroke:#2a3945}.pulse{animation:pulse 2.8s ease-in-out infinite}.rise{animation:rise .7s ease-out both}@keyframes pulse{50%{opacity:.35}}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.pulse,.rise{animation:none}}</style></defs>
<rect width="430" height="360" rx="16" fill="url(#bg)"/><rect width="430" height="360" rx="16" fill="url(#grid)"/><text x="24" y="30" class="mono h">GITHUB OVERVIEW</text><circle cx="390" cy="25" r="4" fill="#35cf7e" class="pulse"/><text x="24" y="52" class="body">PUBLIC API / NO INVENTED NUMBERS</text><g class="rise" style="animation-delay:0ms"><rect x="24" y="86" width="178" height="49" rx="12" fill="#111820"/><text x="38" y="103" class="mono label">REPOSITORIES</text><text x="38" y="126" class="value">13</text></g><g class="rise" style="animation-delay:60ms"><rect x="224" y="86" width="178" height="49" rx="12" fill="#111820"/><text x="238" y="103" class="mono label">PULL REQUESTS</text><text x="238" y="126" class="value">6</text></g><g class="rise" style="animation-delay:120ms"><rect x="24" y="150" width="178" height="49" rx="12" fill="#111820"/><text x="38" y="167" class="mono label">ISSUES</text><text x="38" y="190" class="value">0</text></g><g class="rise" style="animation-delay:180ms"><rect x="224" y="150" width="178" height="49" rx="12" fill="#111820"/><text x="238" y="167" class="mono label">STARS</text><text x="238" y="190" class="value">0</text></g><g class="rise" style="animation-delay:240ms"><rect x="24" y="214" width="178" height="49" rx="12" fill="#111820"/><text x="38" y="231" class="mono label">FOLLOWERS</text><text x="38" y="254" class="value">0</text></g><g class="rise" style="animation-delay:300ms"><rect x="224" y="214" width="178" height="49" rx="12" fill="#111820"/><text x="238" y="231" class="mono label">FOLLOWING</text><text x="238" y="254" class="value">1</text></g><g class="rise" style="animation-delay:360ms"><rect x="24" y="278" width="178" height="49" rx="12" fill="#111820"/><text x="38" y="295" class="mono label">CONTRIBUTIONS</text><text x="38" y="318" class="value">60</text></g><g class="rise" style="animation-delay:420ms"><rect x="224" y="278" width="178" height="49" rx="12" fill="#111820"/><text x="238" y="295" class="mono label">OPEN ISSUES</text><text x="238" y="318" class="value">2</text></g><text x="24" y="344" class="mono label">AAYUSH KUMAWAT / ANDY0802X / PROFILE NODE</text></svg>
