<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 155" role="img" aria-labelledby="title desc">
<title id="title">Language distribution</title><desc id="desc">Repository language distribution from public repositories.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d13"/><stop offset="1" stop-color="#0d171d"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2a3945" stroke-opacity=".18"/></pattern>
<style>.ui{font-family:Arial,sans-serif}.mono{font-family:'Courier New',monospace}.h{font-size:13px;fill:#5edbff}.body{font-size:11px;fill:#81909e}.label{font-size:9px;fill:#65727f;letter-spacing:1.5px}.value{font-size:23px;font-weight:bold;fill:#e7edf2}.line{stroke:#2a3945}.pulse{animation:pulse 2.8s ease-in-out infinite}.rise{animation:rise .7s ease-out both}@keyframes pulse{50%{opacity:.35}}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.pulse,.rise{animation:none}}</style></defs>
<rect width="760" height="155" rx="16" fill="url(#bg)"/><rect width="760" height="155" rx="16" fill="url(#grid)"/><text x="24" y="30" class="mono h">LANGUAGE DISTRIBUTION</text><text x="24" y="49" class="body">BASED ON PUBLIC REPOSITORY METADATA</text><rect x="24.0" y="70" width="431.2" height="12" fill="#f1d34f"/><title>JavaScript · 5 repositories</title><rect x="455.2" y="70" width="172.5" height="12" fill="#5edbff"/><title>CSS · 2 repositories</title><rect x="627.8" y="70" width="86.2" height="12" fill="#c47cff"/><title>Python · 1 repositories</title><text x="24" y="113" class="mono label"><tspan fill="#f1d34f">●</tspan> JavaScript 5</text><text x="199" y="113" class="mono label"><tspan fill="#5edbff">●</tspan> CSS 2</text><text x="374" y="113" class="mono label"><tspan fill="#c47cff">●</tspan> Python 1</text></svg>
