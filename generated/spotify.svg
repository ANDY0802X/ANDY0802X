<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 110" role="img" aria-labelledby="title desc">
<title id="title">Recently played music</title><desc id="desc">Spotify recently played track or graceful local fallback.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d13"/><stop offset="1" stop-color="#0d171d"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2a3945" stroke-opacity=".18"/></pattern>
<style>.ui{font-family:Arial,sans-serif}.mono{font-family:'Courier New',monospace}.h{font-size:13px;fill:#5edbff}.body{font-size:11px;fill:#81909e}.label{font-size:9px;fill:#65727f;letter-spacing:1.5px}.value{font-size:23px;font-weight:bold;fill:#e7edf2}.line{stroke:#2a3945}.pulse{animation:pulse 2.8s ease-in-out infinite}.rise{animation:rise .7s ease-out both}@keyframes pulse{50%{opacity:.35}}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.pulse,.rise{animation:none}}</style></defs>
<rect width="760" height="110" rx="16" fill="url(#bg)"/><rect width="760" height="110" rx="16" fill="url(#grid)"/><text x="24" y="30" class="mono h">RECENTLY PLAYED</text><text x="24" y="57" class="ui" font-size="16" fill="#e7edf2">♫ Lofi mode</text><text x="24" y="79" class="body">Instrumental coding focus · instrumental / lo-fi coding mode</text><text x="610" y="57" class="mono label">SPOTIFY OPTIONAL</text></svg>
